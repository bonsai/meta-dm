name: meta-dm
version: "0.1"

worlds:
  instagram:
    role: external messaging world
  meta:
    role: API and webhook boundary
  github:
    role: canonical development/data world
  agent:
    role: analysis and interaction world
  view:
    role: human-readable presentation world

interfaces:
  - from: instagram
    to: meta
    through: messaging_api
  - from: meta
    to: github
    through: webhook_or_sync
  - from: github
    to: agent
    through: gh_aw
  - from: agent
    to: github
    through: derived_events
  - from: github
    to: view
    through: github_pages

flow:
  - observe
  - ingest
  - normalize
  - persist
  - analyze
  - draft
  - present

boundary_rules:
  - raw_external_payloads_are_untrusted
  - credentials_never_cross_into_public_data
  - derived_events_do_not_replace_source_events
  - gui_is_not_the_canonical_store
