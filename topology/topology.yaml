name: meta-dm
version: "0.2"
purpose: historical_conversation_retrieval

worlds:
  instagram:
    role: source
  meta_api:
    role: interface
  cli:
    role: skill
  local_history:
    role: canonical_storage
  gh_aw:
    role: downstream_analysis

interfaces:
  - from: instagram
    to: meta_api
    via: messaging_api
  - from: meta_api
    to: cli
    via: paginated_history
  - from: cli
    to: local_history
    via: jsonl
  - from: local_history
    to: gh_aw
    via: derived_analysis

flow:
  - identify
  - retrieve_newest
  - paginate_older
  - normalize
  - deduplicate
  - persist
  - report

boundary:
  - gui_is_not_canonical
  - credentials_do_not_enter_history
  - derived_data_does_not_replace_source_history
