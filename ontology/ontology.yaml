name: meta-dm
version: "0.2"
domain: instagram_messaging
primary_use_case: conversation_history_retrieval

entities:
  conversation:
    key: external_id
  message:
    key: external_id
  participant:
    key: external_id
  sync:
    key: conversation_id

relations:
  - conversation_contains_message
  - participant_sends_message
  - sync_retrieves_conversation
  - sync_reaches_older_page

operations:
  - identify_conversation
  - retrieve_page
  - paginate_older
  - normalize_message
  - deduplicate
  - persist_history
  - report_sync

stop_conditions:
  - limit_reached
  - before_reached
  - no_next_page
  - api_boundary
  - error
